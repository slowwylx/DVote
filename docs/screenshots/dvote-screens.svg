<svg width="1200" height="820" viewBox="0 0 1200 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="820" rx="32" fill="#F8F3EC"/>
  <text x="48" y="70" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#1D1B18">DVote portfolio preview</text>
  <text x="48" y="108" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5F574F">Verifiable Firebase-backed voting with signed submissions and public receipts</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1D1B18" flood-opacity="0.16"/>
    </filter>
    <style>
      .phone { fill: #151310; filter: url(#shadow); }
      .screen { fill: #FFFBF7; }
      .title { font: 700 16px Inter, Arial, sans-serif; fill: #1D1B18; }
      .body { font: 400 12px Inter, Arial, sans-serif; fill: #4D463F; }
      .label { font: 700 11px Inter, Arial, sans-serif; fill: #245E4F; }
      .card { fill: #ECE1D5; opacity: 0.72; }
      .primary { fill: #245E4F; }
      .secondary { fill: #C9E8DC; }
    </style>
  </defs>

  <g transform="translate(54 150)">
    <rect class="phone" width="160" height="300" rx="24"/>
    <rect class="screen" x="8" y="10" width="144" height="280" rx="18"/>
    <text class="label" x="22" y="48">SIGN IN</text>
    <text class="title" x="22" y="88">DVote</text>
    <text class="body" x="22" y="116">Private votes.</text>
    <text class="body" x="22" y="136">Public receipts.</text>
    <rect class="primary" x="22" y="210" width="116" height="34" rx="8"/>
    <text x="45" y="232" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="white">Google sign-in</text>
  </g>

  <g transform="translate(246 150)">
    <rect class="phone" width="160" height="300" rx="24"/>
    <rect class="screen" x="8" y="10" width="144" height="280" rx="18"/>
    <text class="label" x="22" y="48">SURVEYS</text>
    <rect class="card" x="20" y="70" width="120" height="58" rx="10"/>
    <text class="title" x="30" y="94">Team retro</text>
    <text class="body" x="30" y="114">18 votes</text>
    <rect class="card" x="20" y="142" width="120" height="58" rx="10"/>
    <text class="title" x="30" y="166">Roadmap</text>
    <text class="body" x="30" y="186">7 votes</text>
    <circle class="primary" cx="124" cy="250" r="18"/>
    <text x="118" y="256" font-family="Inter, Arial, sans-serif" font-size="22" fill="white">+</text>
  </g>

  <g transform="translate(438 150)">
    <rect class="phone" width="160" height="300" rx="24"/>
    <rect class="screen" x="8" y="10" width="144" height="280" rx="18"/>
    <text class="label" x="22" y="48">CREATE</text>
    <rect class="card" x="20" y="70" width="120" height="28" rx="7"/>
    <rect class="card" x="20" y="110" width="120" height="46" rx="7"/>
    <rect class="secondary" x="20" y="170" width="120" height="20" rx="6"/>
    <rect class="secondary" x="20" y="200" width="120" height="20" rx="6"/>
    <rect class="primary" x="20" y="242" width="120" height="32" rx="8"/>
    <text x="48" y="263" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="white">Create survey</text>
  </g>

  <g transform="translate(630 150)">
    <rect class="phone" width="160" height="300" rx="24"/>
    <rect class="screen" x="8" y="10" width="144" height="280" rx="18"/>
    <text class="label" x="22" y="48">VOTE</text>
    <text class="title" x="22" y="82">Pick option</text>
    <rect class="card" x="20" y="104" width="120" height="36" rx="10"/>
    <circle class="primary" cx="36" cy="122" r="7"/>
    <text class="body" x="52" y="126">Option A</text>
    <rect class="card" x="20" y="152" width="120" height="36" rx="10"/>
    <circle cx="36" cy="170" r="7" stroke="#245E4F" stroke-width="2"/>
    <text class="body" x="52" y="174">Option B</text>
    <rect class="primary" x="20" y="236" width="120" height="34" rx="8"/>
    <text x="43" y="258" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="white">Submit vote</text>
  </g>

  <g transform="translate(822 150)">
    <rect class="phone" width="160" height="300" rx="24"/>
    <rect class="screen" x="8" y="10" width="144" height="280" rx="18"/>
    <text class="label" x="22" y="48">RECEIPT</text>
    <rect class="secondary" x="24" y="72" width="112" height="70" rx="14"/>
    <text class="title" x="43" y="104">Vote accepted</text>
    <text class="body" x="34" y="126">hash: 91af3e...</text>
    <text class="title" x="22" y="174">Result</text>
    <rect class="primary" x="22" y="194" width="92" height="8" rx="4"/>
    <rect class="secondary" x="22" y="218" width="58" height="8" rx="4"/>
    <rect class="secondary" x="22" y="242" width="76" height="8" rx="4"/>
  </g>

  <g transform="translate(1014 150)">
    <rect class="phone" width="160" height="300" rx="24"/>
    <rect class="screen" x="8" y="10" width="144" height="280" rx="18"/>
    <text class="label" x="22" y="48">PROFILE</text>
    <circle class="secondary" cx="80" cy="92" r="26"/>
    <text class="title" x="42" y="144">Anonymous voter</text>
    <text class="body" x="30" y="178">Created surveys: 3</text>
    <text class="body" x="30" y="200">Participated: 12</text>
    <text class="body" x="30" y="222">Key MIIBIjANBg...</text>
    <rect class="primary" x="20" y="246" width="120" height="32" rx="8"/>
    <text x="58" y="267" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="white">Sign out</text>
  </g>

  <g transform="translate(54 510)">
    <rect x="0" y="0" width="1092" height="214" rx="22" fill="#ECE1D5"/>
    <text x="28" y="44" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1D1B18">Security model</text>
    <text x="28" y="80" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4D463F">Client signs payload → Cloud Function validates auth, schema, expiry, duplicate vote, option IDs, profile public key, signature and commitment hash.</text>
    <text x="28" y="118" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4D463F">Function writes private /votes/{uid}, public /receipts/{receiptId}, and aggregate result fields transactionally.</text>
    <text x="28" y="156" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4D463F">Firestore rules deny client survey/vote/result writes and public raw vote/profile reads.</text>
  </g>
</svg>
