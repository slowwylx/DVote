[versions]
agp = "9.3.1"
credentials = "1.6.0"
credentialsPlayServicesAuth = "1.6.0"
firebaseBom = "34.14.0"
googleid = "1.2.0"
kotlin = "2.3.21"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
lifecycleViewmodelNavigation3 = "2.10.0"
activityCompose = "1.13.0"
coroutines = "1.11.0"
collectionsImmutable = "0.4.0"
javaxInject = "1"
junit = "4.13.2"
hilt="2.60.1"
hiltNavigationCompose="1.3.0"
ksp="2.3.6"
navigation3 = "1.1.2"
androidxComposeBom = "2026.05.01"
material3 = "1.4.0"
serialization="1.11.0"
googleServices = "4.4.4"
crashlytics = "3.0.7"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNavigation3" }

androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentialsPlayServicesAuth" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
firebase-appcheck = { module = "com.google.firebase:firebase-appcheck" }
